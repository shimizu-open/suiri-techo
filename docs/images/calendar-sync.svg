<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><defs><marker id="a2a2118" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a2118"/></marker><marker id="a1f2d4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2d4a"/></marker><marker id="a9a7634" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a7634"/></marker><marker id="a1e4d3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e4d3a"/></marker><marker id="a6b5d4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b5d4b"/></marker></defs>
<rect width="1240" height="1000" fill="#ffffff"/>
<text x="20" y="40" font-size="22" fill="#2a2118" font-weight="bold">推理手帳 ⇄ Google カレンダー</text>
<rect x="20" y="60" width="210" height="840" fill="#f7f3ea"/>
<rect x="20" y="60" width="210" height="32" rx="6" fill="#6b5d4b"/>
<text x="125.0" y="81" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">画面（利用者）</text>
<rect x="250" y="60" width="320" height="840" fill="#f7f3ea"/>
<rect x="250" y="60" width="320" height="32" rx="6" fill="#1f2d4a"/>
<text x="410.0" y="81" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">web の箱（受付・用事）とデータベース</text>
<rect x="590" y="60" width="310" height="840" fill="#f7f3ea"/>
<rect x="590" y="60" width="310" height="32" rx="6" fill="#9a7634"/>
<text x="745.0" y="81" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">worker の箱（キュー・予定）</text>
<rect x="920" y="60" width="300" height="840" fill="#f7f3ea"/>
<rect x="920" y="60" width="300" height="32" rx="6" fill="#1e4d3a"/>
<text x="1070.0" y="81" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Google</text>
<path d="M20 104 H1220" stroke="#cfc4ae" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="28" y="122" font-size="13" fill="#2a2118" font-weight="bold" text-anchor="start">A つなぐ（6-6）</text>
<path d="M20 352 H1220" stroke="#cfc4ae" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="28" y="370" font-size="13" fill="#2a2118" font-weight="bold" text-anchor="start">B 書き出す（6-10）</text>
<path d="M20 580 H1220" stroke="#cfc4ae" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="28" y="598" font-size="13" fill="#2a2118" font-weight="bold" text-anchor="start">C 取り込む（15分ごと・6-11）</text>
<path d="M20 758 H1220" stroke="#cfc4ae" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="28" y="776" font-size="13" fill="#2a2118" font-weight="bold" text-anchor="start">D 今日の予定（6-12）</text>
<rect x="30" y="140" width="190" height="71" rx="8" fill="#ffffff" stroke="#6b5d4b" stroke-width="2"/>
<text x="40" y="162" font-size="13" fill="#6b5d4b" font-weight="bold" text-anchor="start">設定 → カレンダーとつなぐ</text>
<text x="40" y="181" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">説明を読んで</text>
<text x="40" y="200" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">「同意して Google へ進む」</text>
<rect x="260" y="122" width="300" height="52" rx="8" fill="#ffffff" stroke="#1f2d4a" stroke-width="2"/>
<text x="270" y="144" font-size="13" fill="#1f2d4a" font-weight="bold" text-anchor="start">ConnectCalendarController</text>
<text x="270" y="163" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">redirect：スコープ2つ・offline・consent</text>
<rect x="930" y="122" width="280" height="52" rx="8" fill="#ffffff" stroke="#1e4d3a" stroke-width="2"/>
<text x="940" y="144" font-size="13" fill="#1e4d3a" font-weight="bold" text-anchor="start">Google の同意画面</text>
<text x="940" y="163" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">利用者がカレンダーを許可する</text>
<rect x="260" y="212" width="300" height="90" rx="8" fill="#ffffff" stroke="#1f2d4a" stroke-width="2"/>
<text x="270" y="234" font-size="13" fill="#1f2d4a" font-weight="bold" text-anchor="start">callback → ConnectCalendar</text>
<text x="270" y="253" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">① ログイン中と同じ sub か</text>
<text x="270" y="272" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">② スコープが全部そろったか ③ refresh token</text>
<text x="270" y="291" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">トークンを暗号化して保存</text>
<rect x="930" y="214" width="280" height="52" rx="8" fill="#ffffff" stroke="#1e4d3a" stroke-width="2"/>
<text x="940" y="236" font-size="13" fill="#1e4d3a" font-weight="bold" text-anchor="start">calendars.insert</text>
<text x="940" y="255" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">専用カレンダー「推理手帳」を作る</text>
<rect x="600" y="262" width="290" height="52" rx="8" fill="#ffffff" stroke="#9a7634" stroke-width="2"/>
<text x="610" y="284" font-size="13" fill="#9a7634" font-weight="bold" text-anchor="start">PushAllTasksToCalendar</text>
<text x="610" y="303" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">期日のある未完了タスクを1件ずつ</text>
<path d="M220 170 L258 170" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<path d="M560 145 L928 145" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<text x="745" y="139" font-size="11.5" fill="#6b5d4b" font-weight="normal" text-anchor="middle">Google へ送り出す</text>
<path d="M930 168 L578 168 L578 236 L562 236" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<text x="745" y="184" font-size="11.5" fill="#6b5d4b" font-weight="normal" text-anchor="middle">許可して戻る（/calendar/callback）</text>
<path d="M560 222 L928 222" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<text x="745" y="216" font-size="11.5" fill="#6b5d4b" font-weight="normal" text-anchor="middle">前のものが残っていれば使う</text>
<path d="M560 300 L598 300" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<rect x="30" y="392" width="190" height="90" rx="8" fill="#ffffff" stroke="#6b5d4b" stroke-width="2"/>
<text x="40" y="414" font-size="13" fill="#6b5d4b" font-weight="bold" text-anchor="start">タスクを作る・直す</text>
<text x="40" y="433" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">済みにする・消す</text>
<text x="40" y="452" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">（予想を立てると</text>
<text x="40" y="471" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">確かめるタスクもできる）</text>
<rect x="260" y="380" width="300" height="90" rx="8" fill="#ffffff" stroke="#1f2d4a" stroke-width="2"/>
<text x="270" y="402" font-size="13" fill="#1f2d4a" font-weight="bold" text-anchor="start">TaskObserver（見張り役）</text>
<text x="270" y="421" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">saving：予定の ID（UUID）を先に決める</text>
<text x="270" y="440" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">created・updated・deleted：仕事を積む</text>
<text x="270" y="459" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">保存が確定してから（afterCommit）</text>
<rect x="260" y="502" width="300" height="33" rx="8" fill="#ffffff" stroke="#1f2d4a" stroke-width="2"/>
<text x="270" y="524" font-size="13" fill="#1f2d4a" font-weight="bold" text-anchor="start">jobs 表（キュー。後回しの仕事の列）</text>
<rect x="600" y="392" width="290" height="90" rx="8" fill="#ffffff" stroke="#9a7634" stroke-width="2"/>
<text x="610" y="414" font-size="13" fill="#9a7634" font-weight="bold" text-anchor="start">PushTaskToCalendar</text>
<text x="610" y="433" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">RemoveTaskFromCalendar</text>
<text x="610" y="452" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">タスクを読み直して送る</text>
<text x="610" y="471" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">失敗したら間を空けて5回まで</text>
<rect x="930" y="392" width="280" height="90" rx="8" fill="#ffffff" stroke="#1e4d3a" stroke-width="2"/>
<text x="940" y="414" font-size="13" fill="#1e4d3a" font-weight="bold" text-anchor="start">events.insert（409 なら PUT）</text>
<text x="940" y="433" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">events.delete</text>
<text x="940" y="452" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">送る：題名・日時・戻るリンク</text>
<text x="940" y="471" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">本文（メモ・予想の文）は送らない</text>
<path d="M220 430 L258 430" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<path d="M410 470 L410 500" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<path d="M560 518 L640 518 L640 484" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<text x="648" y="540" font-size="11.5" fill="#6b5d4b" font-weight="normal" text-anchor="start">worker が取り出す</text>
<path d="M890 430 L928 430" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<rect x="600" y="612" width="290" height="71" rx="8" fill="#ffffff" stroke="#9a7634" stroke-width="2"/>
<text x="610" y="634" font-size="13" fill="#9a7634" font-weight="bold" text-anchor="start">schedule:work（15分ごと）</text>
<text x="610" y="653" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">PullCalendarChanges（1人ずつ）</text>
<text x="610" y="672" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">→ ApplyCalendarChanges</text>
<rect x="930" y="612" width="280" height="71" rx="8" fill="#ffffff" stroke="#1e4d3a" stroke-width="2"/>
<text x="940" y="634" font-size="13" fill="#1e4d3a" font-weight="bold" text-anchor="start">events.list?syncToken=…</text>
<text x="940" y="653" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">前回から変わった予定だけ</text>
<text x="940" y="672" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">410 なら印を捨てて全件</text>
<rect x="260" y="606" width="300" height="109" rx="8" fill="#ffffff" stroke="#1f2d4a" stroke-width="2"/>
<text x="270" y="628" font-size="13" fill="#1f2d4a" font-weight="bold" text-anchor="start">データベースの tasks を直す</text>
<text x="270" y="647" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">動いた日時 → 期日・時刻・長さ</text>
<text x="270" y="666" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">消された → つながりだけ外す</text>
<text x="270" y="685" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">Google で作った予定は取り込まない</text>
<text x="270" y="704" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">（見張り役に知らせない保存）</text>
<path d="M890 632 L928 632" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<path d="M930 672 L892 672" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<text x="911" y="702" font-size="11" fill="#6b5d4b" font-weight="normal" text-anchor="middle">変わった予定</text>
<path d="M600 650 L562 650" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<rect x="30" y="792" width="190" height="52" rx="8" fill="#ffffff" stroke="#6b5d4b" stroke-width="2"/>
<text x="40" y="814" font-size="13" fill="#6b5d4b" font-weight="bold" text-anchor="start">今日の画面</text>
<text x="40" y="833" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">今日の予定とタスク</text>
<rect x="260" y="784" width="300" height="71" rx="8" fill="#ffffff" stroke="#1f2d4a" stroke-width="2"/>
<text x="270" y="806" font-size="13" fill="#1f2d4a" font-weight="bold" text-anchor="start">AgendaQuery → GoogleCalendarAgenda</text>
<text x="270" y="825" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">cache に5分だけ覚える（保存しない）</text>
<text x="270" y="844" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">失敗したら空（画面は止めない）</text>
<rect x="600" y="822" width="290" height="52" rx="8" fill="#ffffff" stroke="#9a7634" stroke-width="2"/>
<text x="610" y="844" font-size="13" fill="#9a7634" font-weight="bold" text-anchor="start">cache:prune-expired</text>
<text x="610" y="863" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">5分ごとに期限切れの行を消す</text>
<rect x="930" y="784" width="280" height="71" rx="8" fill="#ffffff" stroke="#1e4d3a" stroke-width="2"/>
<text x="940" y="806" font-size="13" fill="#1e4d3a" font-weight="bold" text-anchor="start">events.list（primary）</text>
<text x="940" y="825" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">今日の0時〜次の日の0時</text>
<text x="940" y="844" font-size="12" fill="#2a2118" font-weight="normal" text-anchor="start">fields：題名と日時だけ</text>
<path d="M220 815 L258 815" fill="none" stroke="#2a2118" stroke-width="1.9" marker-end="url(#a2a2118)"/>
<path d="M560 800 L928 800" fill="none" stroke="#2a2118" stroke-width="1.9" marker-start="url(#a2a2118)" marker-end="url(#a2a2118)"/>
<text x="745" y="794" font-size="11.5" fill="#6b5d4b" font-weight="normal" text-anchor="middle">聞く ／ 題名と時刻を受け取る</text>
<path d="M600 852 L562 852" fill="none" stroke="#9a7634" stroke-width="1.9" stroke-dasharray="4 3" marker-end="url(#a9a7634)"/>
<rect x="20" y="914" width="1200" height="70" rx="8" fill="#ffffff" stroke="#d8cfbd"/>
<text x="36" y="938" font-size="12.5" fill="#2a2118" font-weight="normal" text-anchor="start">トークン（GoogleTokens）：Google に問い合わせる前に、期限の5分前を過ぎていたら refresh token で取り直す。invalid_grant が返ったら</text>
<text x="36" y="958" font-size="12.5" fill="#2a2118" font-weight="normal" text-anchor="start">status = broken にして書き出しと取り込みを止める（設定に「連携が切れました」。つなぎ直すと期日つきのタスクを全部書き直す）。</text>
<text x="36" y="978" font-size="12.5" fill="#2a2118" font-weight="normal" text-anchor="start">解除・退会では Google で許可を取り消し（revoke）、タスクとのつながりを外してから、連携の行を消す。</text>
</svg>
