; エラーの中身（ファイルの場所など）を画面に出さない。Laravel のエラー画面は APP_DEBUG で切り替わる
display_errors = off
log_errors = on
error_log = /dev/stderr
memory_limit = 512M
; 送信の大きさの上限。推理手帳にはファイルを上げる機能がないので小さくする（PHP 公式の php2shell 勧告：アップロードなしなら 8M、upload_max_filesize はそれより下）
upload_max_filesize = 2M
post_max_size = 8M
default_charset = UTF-8
; 応答に PHP の版（X-Powered-By: PHP/8.4.x）を書かない。版が分かると、その版の弱点を狙われやすくなるため
expose_php = Off

[Date]
date.timezone = Asia/Tokyo

[Session]
; アップロードの進み具合を PHP のセッションに書く機能を止める。Laravel は使っていない。
; 2026-10 の PHP 本体の脆弱性（php2shell, CVE-2026-109618/109619）の入口と見られているための応急処置。
; 根本の対策は PHP を修正版に上げること（Dockerfile の php:8.4-fpm を作り直す）
session.upload_progress.enabled = 0
; PHP のセッションで、知らない ID を受け付けない（一般的な守りの強化。Laravel は自前のセッションなので動きは変わらない）
session.use_strict_mode = 1
