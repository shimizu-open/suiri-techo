server {
    listen 80;
    root /data/public;
    index index.php;
    charset utf-8;
    # 応答とエラーの画面に nginx の版を書かない（Server: nginx だけにする）。版が分かると、その版の弱点を狙われやすくなるため
    server_tokens off;

    # ファイルを送る形（multipart/form-data）の送信は受け付けない。推理手帳にはファイルを上げる機能がないため。
    # 2026-10 の PHP 本体の脆弱性（php2shell）はこの形の送信を PHP が読むところを狙うので、PHP に届く前に止める。
    # ファイルを上げる機能を作るときは、この行を外す（その経路だけ通す）
    if ($http_content_type ~* "multipart/form-data") { return 415; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
