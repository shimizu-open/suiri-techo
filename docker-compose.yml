name: suiri-techo

# コンテナのログが際限なく増えないよう、1ファイル 10MB × 5 個までにする
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PHP（Laravel）を動かす係。画面の CSS・JS のビルド（Node.js）もここで行う
  app:
    build: ./infra/php
    user: "1000:1000"
    volumes:
      - ./src:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks: [suiri-net]

  # 決まった時刻の仕事（カレンダーの取り込み・期限の過ぎたキャッシュの掃除）と、後回しにした仕事（カレンダーへの書き込み）を片づける係
  worker:
    build: ./infra/php
    user: "1000:1000"
    command: sh -c "php artisan schedule:work & php artisan queue:work --sleep=3 --tries=3 --max-time=3600"
    volumes:
      - ./src:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks: [suiri-net]

  # 入口（nginx）。ブラウザからの通信を受けて、PHP の係に渡す
  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_LISTEN}:80"
    volumes:
      - ./src:/data
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    restart: unless-stopped
    logging: *logging
    networks: [suiri-net]

  # データベース（MySQL）
  db:
    build: ./infra/mysql
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - db-store:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging
    networks: [suiri-net]

volumes:
  db-store:

networks:
  suiri-net:
    # Docker 既定のアドレス帯が他のプロジェクトで埋まっているため、使う範囲を明示する（BSE は 10.231.0.0/24）
    ipam:
      config:
        - subnet: 10.232.0.0/24
